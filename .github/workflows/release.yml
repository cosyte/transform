name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish (provenance auto-enables when
# this repo is public) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# npm authenticates by trusted publishing (OIDC), so there is no npm token: the package's
# trusted-publisher entry on npmjs.com names this repository and `release.yml` (this file).
# `secrets: inherit` passes RELEASE_PR_TOKEN (authors the "Version Packages" PR, so its checks run)
# and DOCS_REPO_DISPATCH_TOKEN (the docs rebuild); store both as repository or organization
# secrets, not as `release` environment secrets.
#
# ▶ KNOWN TRAP, WHEN RELEASE_PR_TOKEN IS MISSING. The `ci-required-checks` ruleset on this repo
# (id 19914044) requires six contexts with `bypass_actors: []`. Without RELEASE_PR_TOKEN the shared
# workflow opens the "Version Packages" PR with the default `GITHUB_TOKEN`, and GitHub does not
# start workflow runs for events raised by that token, so that PR arrives with ZERO check runs.
# Required contexts that never arrive are PENDING, not failing, and with no bypass actors nobody,
# including an admin, can merge past them. MEASURED, not predicted: PR #10 ("Version Packages",
# head `2996df7`, opened 2026-07-22) had 0 check runs and reported `mergeStateStatus: BLOCKED`.
# The shared workflow warns in its run when the token is missing. The escape, done last and
# immediately before merging, is one commit onto `changeset-release/main`, which raises a normal
# `pull_request` event and produces all six:
#
#   gh pr checkout <n> && git commit --allow-empty -m "chore: run CI on the version PR" && git push
#
# Adding a bypass actor would also clear it and is DELIBERATELY REJECTED: it would let a human
# merge a red PR on a healthcare package.

on:
  push:
    branches: [main]

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm trusted publishing and provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@workflows-2026-11-07-498c7c13c886
    with:
      package-name: "@cosyte/transform"
    secrets: inherit
