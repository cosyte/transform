name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │ A REQUIRED JOB GATES ALL OF ITS STEPS. The `ci-required-checks` ruleset on this repo (id │
  # │ 19914044) requires the CONTEXTS `ci / verify (22, ubuntu-latest)`, `ci / verify (24,     │
  # │ ubuntu-latest)` and `ci / actionlint`. Every gate the shared pipeline runs (typecheck,   │
  # │ lint, format:check, PHI scan, test, gating coverage, build, attw, dual ESM/CJS smoke) is │
  # │ a STEP inside `verify`, and is required only because that job is. Promote any one of     │
  # │ them to its own job and it is silently NO LONGER REQUIRED: the ruleset names contexts,   │
  # │ the new context is not in it, and nothing anywhere errors or warns. If you split a step  │
  # │ out, add its context to the ruleset in the same change.                                  │
  # │                                                                                          │
  # │ AND THE GATE CAN LEAVE THE JOB ENTIRELY, WHICH IS THE SHARPER EDGE HERE. Requiring       │
  # │ `verify` pins that `pnpm test` RUNS. It does not pin WHAT IT RUNS. The suites are        │
  # │ selected by the `include` glob in this repo's `vitest.config.ts`, which today picks up   │
  # │ the property + fuzz suites (`test/messages/property.test.ts`,                            │
  # │ `test/datatypes/boundary.property.test.ts`) carrying the never-throw, value-free-issue   │
  # │ and emit-validity claims. THAT GLOB IS NOT THE ONLY LEVER: the `test`/`test:coverage`    │
  # │ script bodies in `package.json` are plain `vitest run` invocations, and a path argument  │
  # │ or `--exclude` added there drops suites without touching the glob. Narrow either and     │
  # │ those suites vanish with this job still green and the ruleset still satisfied. There is  │
  # │ a banner on `vitest.config.ts` too.                                                      │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. Repo-specific extra jobs (e.g. an
  # examples smoke, a starter-kit build) are added on top of this caller, never instead of it.
  # The shared pipeline's optional PHI-scan step is switched on, and what it runs is the all-mode
  # walk over this repo's whole TRACKED corpus, reconciled against `git ls-files` so a root that is
  # missing, emptied or replaced refuses rather than reporting clean. It runs the cross-cutting
  # SSN/email floor AND an HL7 v2 structured pass over a NAMED SET of PID/NK1/GT1/IN1 fields. The
  # banner at the top of scripts/phi-scan.ts enumerates exactly which fields those are and states
  # that anything not named is not checked; read it as the whole of the coverage, because two
  # refuter passes measured the opposite shape (a list of what is NOT covered) incomplete.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@main
    with:
      run-phi-scan: true
