name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`TRANSFORM-6`), phase and wave language, roadmap section numbers,
# ADR numbers, meta-repo paths and process commentary belong in the changeset, CHANGELOG.md,
# the commit, the PR and the roadmap, never in README.md, docs-content/, the npm description,
# a JSDoc block a consumer's editor renders, or a message a consumer reads in their logs. The
# rule is written out in the meta-repo's `documentation/conventions.md` ("No internal project
# bookkeeping on a public surface"); `scripts/check-no-internal-refs.sh` is what enforces it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(TRANSFORM-7)` into a README; a job that reds does not.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The reusable pipeline is not an option:
# this repo's `ci` job calls cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed
# ladder and no arbitrary repo script. Adding this there would also flip every other caller
# red on its next run, and remediating each is its own deliberate piece of work. A shared
# pipeline is the wrong place to land a rule most of its callers cannot yet satisfy.
#
# Keeping it out of ci.yml also keeps it cheap: this job is a checkout and a handful of greps
# over 9 markdown/JSON files and 31 source files, while ci.yml drives the full Node 22 + 24
# matrix plus the release-dry-run job.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# THIS rule says identifiers BELONG in the commit, the PR and the changeset, so a PR-text
# half here would red on correct work. That is also why there is no `edited` trigger: nothing
# here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`, which is also on the meta-repo's
# `scripts/verify.sh transform` ladder.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id is the check-run context name a branch ruleset requires. Renaming it silently
  # detaches the required check, so the ruleset stops protecting anything while still looking
  # configured. Rename both together or neither.
  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The script self-tests before it reports: it proves each rule still matches its own
      # positive sample AND still lets through the reference material it was most likely to
      # destroy (`PID-3`, `OBX-5`, `RXA-20`, `HL7-V2`, `FHIR-R4`, `FHIR-core`, a Phase III
      # trial, the CSP Study Phase field names). It refuses to print OK from a scan that did
      # not read all of its input. No `|| true`, no `continue-on-error`: a check that cannot
      # fail is documentation.
      - name: Check the public surface
        run: bash scripts/check-no-internal-refs.sh

      # THE AGENT-INSTRUCTION CONTRACT (always-read CLAUDE.md + on-demand
      # documentation/agent-notes.md). It rides in THIS job on purpose, and the reason is the
      # banner above: a required job gates all of its steps, so a step added here is required
      # the moment it lands, with no ruleset edit and therefore no window in which open PRs
      # strand pending on a context nothing has emitted yet.
      #
      # IT IS ALSO ENFORCED A SECOND, INDEPENDENT WAY, and that is deliberate rather than
      # belt-and-braces habit. test/scripts/agent-notes-contract.test.ts runs the same gate
      # from inside `ci / verify`. But that route inherits this repo's documented "THE GATE
      # CAN LEAVE THE JOB" hole verbatim -- the `include` glob in vitest.config.ts and the
      # `test`/`test:coverage` script bodies in package.json can each drop the suite with the
      # job still green. This step depends on neither, so the two routes cannot be removed by
      # the same edit.
      #
      # BARE `node`, NOT `tsx`, so this job stays a checkout plus a node -- no pnpm, no
      # lockfile install, which is what keeps it cheap next to the full ci.yml matrix. Node 24
      # strips types natively; the local `pnpm check:agent-notes` runs the same file through
      # tsx because the repo's engine floor is 22. The two paths are pinned to agree by a test
      # in the suite above, so a divergence reds rather than being assumed away.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check the agent-instruction contract
        run: node scripts/check-agent-notes.ts
