name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`TRANSFORM-6`), phase and wave language, roadmap section numbers,
# ADR numbers, meta-repo paths and process commentary belong in the changeset, CHANGELOG.md,
# the commit, the PR and the roadmap, never in README.md, docs-content/, the npm description,
# a JSDoc block a consumer's editor renders, or a message a consumer reads in their logs. The
# rule is a line in this repo's CLAUDE.md, the umbrella's plans/standards.md (ST34) makes this
# one of the gates every Cosyte repo runs, and `cosyte-internal-refs`, the shared gate from
# `@cosyte/script-utils`, enforces it, configured by `scripts/internal-refs.json`.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(TRANSFORM-7)` into a README; a job that reds does not.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULES LIVE. `pnpm check:no-internal-refs`, the shared
# gate workflow's default command, which runs `cosyte-internal-refs` from the
# `@cosyte/script-utils` devDependency. The job delegates the plumbing (checkout, pnpm, Node,
# and the install the gate needs) to the shared gate workflow, which carries no pattern, no
# allow-list and no file selection of its own: it prepares the tree, runs the command, and lets
# the command's exit status decide the job. The rules are the shared ones;
# `scripts/internal-refs.json` holds what is this package's own: its known project prefixes,
# the standards designations never to flag, its public surface, the passes over `src/` doc
# comments and string literals (the diagnostic text a consumer reads in their logs), and two
# extra rules that keep the shared gate reading at least what this repository's former gate
# read.
#
# THE COMMAND IS ONE PROGRAM. The shared workflow runs it through an UNQUOTED expansion,
# `$SURFACE_COMMAND` under `set -euo pipefail`. Word splitting produces WORDS, never operators,
# so a value carrying `&&` hands `&&` to the FIRST program as an argument and the second never
# runs at all, with the job still green. Measured in a shell, not reasoned about. A second check
# belongs in a `package.json` script or a job of its own, never in this input.
#
# THE AGENT-INSTRUCTION CONTRACT MOVED OUT OF THIS JOB. The CLAUDE.md card is checked by
# `pnpm check:claude-card` in ci.yml's `standards` job, beside the README and catalog checks.
# That context binds only once ruleset `19914044` names it, which is the window this job used to
# avoid by carrying the contract itself.
#
# THIS JOB INSTALLS. The gate lives in node_modules, so the caller below names the installing
# form of the shared gate workflow.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset must require.
# Renaming the job detaches that requirement with no error anywhere, and a required
# context nothing emits blocks every pull request.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The shared ci pipeline is not an option:
# this repo's `ci` job calls cosyte/.github/.github/workflows/ci.yml at the published
# reference, which runs a fixed ladder and no arbitrary repo script. Adding this there would
# also flip every other caller red on its next run, and remediating each is its own deliberate
# piece of work. A shared pipeline is the wrong place to land a rule most of its callers cannot
# yet satisfy.
#
# Keeping it out of ci.yml also keeps it cheap: this job is a checkout, an install and one Node
# process over the public-surface files and the source doc comments and string literals, while ci.yml
# drives the full Node 22, 24, and 26 matrix plus the prepublish job.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# THIS rule says identifiers BELONG in the commit, the PR and the changeset, so a PR-text
# half here would red on correct work. That is also why there is no `edited` trigger: nothing
# here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Named by the published reference, as its release notes show, and the same one
    # every shared caller in this repository names, so they move together. cosyte/.github
    # publishes a reference once and never moves or deletes it, and its releases are
    # immutable, so the name resolves to one commit; its release note is findable by the
    # same name.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No `with:`: the shared default command, `pnpm check:no-internal-refs`, is this gate.
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
